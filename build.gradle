plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("**/.cache")
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven {url = "https://libraries.minecraft.net/"}
    maven {url = "https://neoforged.forgecdn.net/releases"}
    maven {url = "https://neoforged.forgecdn.net/mojang-meta"}

    // 本地 JAR 统一放在 libs/
    flatDir { dirs 'libs' }

    maven { url = "https://cursemaven.com" }
    maven { url = "https://maven.k-4u.nl" }
    maven { url = "https://modmaven.dev/" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // 1. libs/ 下所有 JAR 作为实现依赖
    implementation fileTree(dir: 'libs', include: ['*.jar'], exclude: ['ufo-2.1-fix7.jar', 'ufo-3.0.0-beta.3.jar', 'ufo-3.0.0-beta.4.jar', 'raishxcore-0.1.0-beta.2.jar', 'ufo-stubs.jar'])

    // 2. UFO 和 raishxcore 单独引入
    compileOnly files('libs/ufo-3.0.0-beta.4.jar')
    compileOnly files('libs/raishxcore-0.1.0-beta.2.jar')
    localRuntime files('libs/ufo-3.0.0-beta.4.jar')
    localRuntime files('libs/raishxcore-0.1.0-beta.2.jar')

    // ==========================================
    // 3. 使用通配符 * 模糊匹配 libs/ 下的文件
    // ==========================================
    // 匹配 ProjectE 和 Project Expansion
    compileOnly fileTree(dir: 'libs', include: ['ProjectE-*.jar', 'projectexpansion-*.jar'])
    
    // 匹配 AE2、闪电科技、OmniCells
    compileOnly fileTree(dir: 'libs', include: ['appliedenergistics2-*.jar', '*ae2lt*.jar', 'AE2-Lightning*.jar', 'ae2omnicells-*.jar'])
    
    // 匹配各种 AE 扩展
    compileOnly fileTree(dir: 'libs', include: ['ExtendedAE-*.jar', 'extendedae_plus-*.jar', 'Glodium-*.jar', 'ae2addonlib-*.jar', 'AE2AddonLib-*.jar'])
    
    // 匹配 KubeJS 及前置
    compileOnly fileTree(dir: 'libs', include: ['kubejs-*.jar', 'rhino-*.jar'])
    
    // 匹配 Mekanism 及扩展
    compileOnly fileTree(dir: 'libs', include: ['Mekanism-*.jar', 'mekanism_extras-*.jar'])
    
    // 匹配界面、工具和库
    compileOnly fileTree(dir: 'libs', include: ['Jade-*.jar', 'JEI*.jar', 'AppliedFlux-*.jar', 'ldlib2-*.jar', 'geckolib-*.jar', 'guideme-*.jar', 'architectury-*.jar'])
    
    // 匹配冒险及其他附属
    compileOnly fileTree(dir: 'libs', include: ['twilightforest-*.jar', 'Re-Avaritia-*.jar'])
    
    // 匹配 FTB 系列
    compileOnly fileTree(dir: 'libs', include: ['ftb-quests-*.jar', 'ftb-library-*.jar', 'ftb-teams-*.jar'])

    // ==========================================
    // 4. Maven 依赖保留
    // ==========================================
    compileOnly "org.appliedenergistics.yoga:yoga:1.0.0"
    compileOnly "dev.vfyjxf:taffy:1.1.4"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
