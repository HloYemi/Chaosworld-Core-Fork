plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("**/.cache")
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven {url = "https://libraries.minecraft.net/"}
    maven {url = "https://neoforged.forgecdn.net/releases"}
    maven {url = "https://neoforged.forgecdn.net/mojang-meta"}

    // 本地 JAR 统一放在 libs/
    flatDir { dirs 'libs' }

    maven { url = "https://cursemaven.com" }
    maven { url = "https://maven.k-4u.nl" }
    maven { url = "https://modmaven.dev/" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // libs/ 下的所有 JAR 作为实现依赖（排除 UFO / raishxcore / stubs，它们单独处理）
    implementation fileTree(dir: 'libs', include: ['*.jar'], exclude: ['ufo-2.1-fix7.jar', 'ufo-3.0.0-beta.3.jar', 'ufo-3.0.0-beta.4.jar', 'raishxcore-0.1.0-beta.2.jar', 'ufo-stubs.jar'])

    // UFO 与 raishxcore 仅编译期与运行时需要，不随依赖传递
    compileOnly files('libs/ufo-3.0.0-beta.4.jar')
    compileOnly files('libs/raishxcore-0.1.0-beta.2.jar')
    localRuntime files('libs/ufo-3.0.0-beta.4.jar')
    localRuntime files('libs/raishxcore-0.1.0-beta.2.jar')

    // 以下原本指向 run/mods/，现全部改为 libs/
    compileOnly files('libs/ProjectE-1.21.1-PE1.1.0.jar')
    compileOnly files('libs/projectexpansion-1.21.1-1.0.6.jar')
    compileOnly files('libs/appliedenergistics2-19.2.18.jar')
    compileOnly files('libs/AE2-Lightning-Tech-CE-2.1.0-beta.5.jar')
    compileOnly files('libs/ExtendedAE-1.21-2.2.36-neoforge.jar')
    compileOnly files('libs/Glodium-1.21-2.2-neoforge.jar')
    compileOnly files('libs/FluxNetworks-1.21.1-8.0.0.jar')
    compileOnly files('libs/more_flux_storage-1.21.1-1.0.3.jar')
    compileOnly files('libs/guideme-21.1.17.jar')
    compileOnly files('libs/ldlib2-neoforge-1.21.1-2.2.40-all.jar')
    compileOnly files('libs/neoecoae-21.2.0-beta1.jar')
    compileOnly files('libs/ae2omnicells-1.21.1-neoforge-1.1.6.jar')
    compileOnly "org.appliedenergistics.yoga:yoga:1.0.0"
    compileOnly "dev.vfyjxf:taffy:1.1.4"
    compileOnly files('libs/kubejs-neoforge-2101.7.2-build.377.jar')
    compileOnly files('libs/rhino-2101.2.8-build.91.jar')
    compileOnly files('libs/ae2addonlib-1.0.3-1.21.1.jar')
    compileOnly files('libs/geckolib-neoforge-1.21.1-4.9.2.jar')
    compileOnly files('libs/Mekanism-1.21.1-10.7.19.85.jar')
    compileOnly files('libs/mekanism_extras-1.21.1-1.4.1.jar')
    compileOnly files('libs/JEIunofficial-1.21.1-neoforge-19.53.0.426.jar')
    compileOnly files('libs/AppliedFlux-1.21-2.1.5-neoforge.jar')
    compileOnly files('libs/Jade-1.21.1-NeoForge-15.10.6.jar')
    compileOnly files('libs/extendedae_plus-1.6.2.jar')
    compileOnly files('libs/twilightforest-1.21.1-4.8.3345-universal.jar')
    compileOnly files('libs/Re-Avaritia-neoforge-1.21.1-1.4.2-release.jar')

    // FTB Quests 集成（运行时可选，由 ModList 检查守卫）
    compileOnly files('libs/ftb-quests-neoforge-2101.1.36.jar')
    compileOnly files('libs/ftb-library-neoforge-2101.1.36.jar')
    compileOnly files('libs/ftb-teams-neoforge-2101.1.9.jar')
    compileOnly files('libs/architectury-neoforge-13.0.8.jar')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
